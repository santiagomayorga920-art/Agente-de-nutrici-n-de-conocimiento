name: Agente de nutrición

on:
  # La píldora diaria la dispara cron-job.org llamando a Render (/cron/pildora) y los mensajes
  # llegan al instante por webhook. Este workflow queda para lanzarlo a mano si hace falta
  # (p. ej. si Render no está disponible); envía la píldora como mucho una vez al día.
  workflow_dispatch:
    inputs:
      enviar_pildora:
        description: "Enviar la píldora de hoy (si aún no se envió)"
        type: boolean
        default: true

# Nunca dos ejecuciones a la vez: comparten la misma base de datos
concurrency:
  group: agente
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar
        run: pip install -e ".[postgres]"

      # El progreso vive en la caché de Actions (no en el repositorio, que es público)
      - name: Recuperar progreso
        uses: actions/cache/restore@v4
        with:
          path: data
          key: estado-${{ github.run_id }}
          restore-keys: estado-

      # Una sola vez: al configurar Supabase se copia el historial guardado en la caché
      - name: Migrar historial a Supabase
        if: hashFiles('data/nutricion.db') != ''
        # Si DATABASE_URL está mal, se avisa con el motivo y el agente sigue con SQLite
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -n "$DATABASE_URL" ]; then nutricion migrar data/nutricion.db; fi

      - name: Ejecutar agente
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Opcional: con Supabase el progreso vive allí; sin él, en la caché de Actions (SQLite)
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TIMEZONE: ${{ vars.TIMEZONE || 'UTC' }}
          ENVIAR_PILDORA: ${{ inputs.enviar_pildora }}
        run: |
          if [ "$ENVIAR_PILDORA" = "true" ]; then
            nutricion tick --enviar-pildora
          else
            nutricion tick
          fi

      - name: Guardar progreso
        if: always() && hashFiles('data/nutricion.db') != ''
        uses: actions/cache/save@v4
        with:
          path: data
          key: estado-${{ github.run_id }}-${{ github.run_attempt }}
