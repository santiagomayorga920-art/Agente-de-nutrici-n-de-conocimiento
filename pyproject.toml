[project]
name = "nutricion"
version = "0.1.0"
description = "Agente de nutrición de conocimiento: píldoras diarias de IA y negocios con desafíos de juicio crítico vía Telegram."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=2.29",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "feedparser>=6.0",
    "tzdata>=2024.1",
    "pillow>=10.1",
]

[project.optional-dependencies]
# Servidor del webhook (Render)
web = ["starlette>=0.40", "uvicorn>=0.30"]
# Base de datos Postgres (Supabase)
postgres = ["psycopg[binary]>=3.2"]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "graphifyy>=0.9.84",
    "starlette>=0.40",
    "psycopg[binary]>=3.2",
]

[project.scripts]
nutricion = "nutricion.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nutricion"]
# Las fuentes de la tarjeta visual viajan con el paquete
artifacts = ["src/nutricion/media/fonts/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:starlette.*", "ignore:Using `httpx`"]
