[project]
name = "nutricion"
version = "0.1.0"
description = "Agente de nutrición de conocimiento: píldoras diarias de IA y negocios con desafíos de juicio crítico vía Telegram."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=2.29",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "feedparser>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "graphifyy>=0.9.84",
]

[project.scripts]
nutricion = "nutricion.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nutricion"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
